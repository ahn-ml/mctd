defaults:
  - df_base

# dataset info
data_mean: null
data_std: null
reward_mean: ${dataset.reward_mean}
reward_std: ${dataset.reward_std}
observation_mean: ${dataset.observation_mean}
observation_std: ${dataset.observation_std}
action_mean: ${dataset.action_mean}
action_std: ${dataset.action_std}
gamma: ${dataset.gamma}
episode_len: ${dataset.episode_len}
env_id: ${dataset.env_id}
dataset: ${dataset.dataset}
# non dataset info
x_shape: null
frame_stack: 10
context_frames: 1
use_reward: False
causal: False
plot_start_goal: True
padding_mode: same
# training hyperparameters
weight_decay: 1e-4
warmup_steps: 10000
# diffusion-related
guidance_scale: 2.0
chunk_size: ${dataset.episode_len}
scheduling_matrix: pyramid

# evaluation task and execution
interaction_seed: ${experiment.validation.seed}
task_id: 1
val_max_steps: 1000 # environment steps of an episode
open_loop_horizon: 1000 # environment steps the plans are executed for
controller_checkpoint_dir: null # Diffusion-QL controller directory (null = the single-cube controller; the release presets set the target-cube controller of each multi-cube size)
controller_checkpoint_epoch: 200
controller_seed: null # replay-plan: RNG seed of the controller
replay_plan_path: null # replay-plan: plan.npz of an earlier run of the same task and seed

# Online Composer with the plan cache
high_level_search: "online-composer" # online-composer | replan (baseline without search) | replay-plan (execute a saved plan.npz with another controller seed)
mctd_max_search_num: 500 # search budget of the cube tree (expanded nodes)
num_samples_best_of_n: 50 # best-of-N replanning of a cube move: samples per plan segment
threshold_for_warp: 0.5 # a plan step longer than this rejects the plan
cube_plan_max_steps: 1000 # plan-point cap of one cube move (segments of episode_len are chained up to it)
cube_plan_cache: True # reuse the plan of an identical cube move
parallel_search_num: 4 # cube tree nodes expanded per iteration, their moves planned in one batch
virtual_visit_weight: 1.0 # redundancy-aware selection weight of the parallel search
cube_num_temporary_positions: 1 # temporary positions per cube (where it can be put aside); a cube tree node moves a cube to its goal or to one of them
cube_goal_threshold: 0.15 # a cube within this distance of its goal is solved
cube_reach_threshold: 0.5 # a plan reaches its goal when the moved cube is within this distance of its target
cube_interval_between_plans: 30 # execution: steps to release a cube and move the arm to the next one
cube_subgoal_threshold: 1.0 # execution: the next subgoal (10 plan points on) once the cube is within this distance
cube_print_out: False # print the cube tree search
cube_viz: False # render the execution: execution.gif in the output directory (and a W&B video when logging)

diffusion:
  stabilization_level: 10
  beta_schedule: linear
  objective: pred_x0
  ddim_sampling_eta: 0.0
  architecture:
    network_size: 128
    num_layers: 12
    attn_heads: 4
    dim_feedforward: 512
